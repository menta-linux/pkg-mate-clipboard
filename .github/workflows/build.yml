name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['menta/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:unstable
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git quilt jq gh devscripts equivs build-essential fakeroot

      - uses: actions/checkout@v4

      - name: Fetch upstream tarball
        run: |
          UPSTREAM=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          mkdir -p ../build
          curl -fsSL -o "../build/mate-clipboard_${UPSTREAM}.orig.tar.gz" \
            "https://github.com/KeremSoke/mate-clipboard/archive/refs/tags/v${UPSTREAM}.tar.gz"
          tar -C ../build -xf "../build/mate-clipboard_${UPSTREAM}.orig.tar.gz"
          cp -a debian "../build/mate-clipboard-${UPSTREAM}/"
          echo "SRCDIR=$(realpath ../build/mate-clipboard-${UPSTREAM})" >> "$GITHUB_ENV"

      - name: Apply quilt patches
        working-directory: ${{ env.SRCDIR }}
        run: |
          export QUILT_PATCHES=debian/patches
          quilt push -a || [ $? -eq 2 ]   # 2 = nothing to apply

      - name: Install Menta dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            mkdir -p /tmp/menta-debs
            for r in mate-desktop mate-panel; do
              gh release download latest -R "menta-linux/pkg-$r" -p '*.deb' -D /tmp/menta-debs --clobber
            done
            rm -f /tmp/menta-debs/*dbgsym*.deb
            apt-get install -y /tmp/menta-debs/*.deb
          } 2>&1 | tee /tmp/menta.log

      - name: Install build dependencies
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control 2>&1 | tee /tmp/deps.log

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          dpkg-buildpackage -us -uc -b 2>&1 | tee /tmp/build.log

      - name: Report failure
        if: failure()
        run: |
          for f in /tmp/menta.log /tmp/deps.log /tmp/build.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 45 "$f" | cut -c1-220 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v ../build/*.deb ../build/*.buildinfo ../build/*.changes "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: mate-clipboard-debs
          path: artifacts/*

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest artifacts/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "latest" --notes "Rolling build of $GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/menta/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* -R "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --notes "Build of $GITHUB_SHA"
